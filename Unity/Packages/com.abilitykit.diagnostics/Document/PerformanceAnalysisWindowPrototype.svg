<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <style>
    text { font-family: Arial, "Microsoft YaHei", sans-serif; }
    .bg { fill: #17191f; }
    .panel { fill: #222631; stroke: #363b48; stroke-width: 1; }
    .panel2 { fill: #1d2028; stroke: #343946; stroke-width: 1; }
    .muted { fill: #9aa3b5; font-size: 13px; }
    .label { fill: #d8deeb; font-size: 13px; }
    .title { fill: #f3f6fc; font-size: 17px; font-weight: 600; }
    .value { fill: #f3f6fc; font-size: 23px; font-weight: 700; }
    .small { fill: #a9b2c3; font-size: 11px; }
    .green { fill: #51d39b; }
    .yellow { fill: #f2c96d; }
    .red { fill: #f27782; }
    .grid { stroke: #343946; stroke-width: 1; }
    .blueLine { fill: none; stroke: #54a7ff; stroke-width: 3; }
    .purpleLine { fill: none; stroke: #9b83ff; stroke-width: 2; }
    .bar { fill: #3d8fe8; }
    .selected { fill: #2f5d88; stroke: #54a7ff; stroke-width: 1; }
  </style>

  <rect class="bg" width="1440" height="1040"/>
  <text x="28" y="36" class="title">AbilityKit 战斗性能分析</text>
  <text x="28" y="58" class="muted">区间调用耗时 · 分配 · GC · 业务上下文</text>
  <text x="1120" y="38" class="small">原型示例数据 · 不是运行时截图</text>

  <rect class="panel" x="20" y="76" width="1400" height="64" rx="5"/>
  <text x="38" y="98" class="small">会话</text><rect class="panel2" x="38" y="106" width="210" height="25" rx="3"/><text x="48" y="123" class="label">battle-2026-11-03-001</text>
  <text x="270" y="98" class="small">帧区间</text><rect class="panel2" x="270" y="106" width="145" height="25" rx="3"/><text x="280" y="123" class="label">1200 – 1680</text>
  <text x="438" y="98" class="small">分组</text><rect class="panel2" x="438" y="106" width="135" height="25" rx="3"/><text x="448" y="123" class="label">技能 / 阶段</text>
  <text x="596" y="98" class="small">排序</text><rect class="panel2" x="596" y="106" width="150" height="25" rx="3"/><text x="606" y="123" class="label">累计耗时 ↓</text>
  <text x="770" y="98" class="small">实体</text><rect class="panel2" x="770" y="106" width="170" height="25" rx="3"/><text x="780" y="123" class="label">全部实体</text>
  <rect x="1252" y="101" width="148" height="30" rx="4" fill="#347dcc"/><text x="1290" y="121" fill="#fff" font-size="13">应用筛选</text>

  <rect class="panel" x="20" y="152" width="1400" height="52" rx="5"/>
  <text x="38" y="174" class="small">采集级别</text>
  <rect class="panel2" x="38" y="180" width="60" height="18" rx="3"/><text x="53" y="193" class="small">Off</text>
  <rect class="selected" x="104" y="177" width="102" height="23" rx="4"/><text x="119" y="193" fill="#fff" font-size="12">Summary</text>
  <rect class="panel2" x="212" y="180" width="84" height="18" rx="3"/><text x="228" y="193" class="small">Standard</text>
  <rect class="panel2" x="302" y="180" width="78" height="18" rx="3"/><text x="319" y="193" class="small">Verbose</text>
  <text x="410" y="190" class="label">当前区间：1200–1680 帧</text>
  <text x="680" y="190" class="green small">分配统计：支持</text>
  <text x="810" y="190" class="yellow small">GC 暂停：可观测；调用点归因：不可用</text>
  <text x="1210" y="190" class="small">缓冲 0 丢弃</text>

  <g transform="translate(20 216)">
    <rect class="panel" width="220" height="78" rx="5"/><text x="16" y="23" class="muted">技能累计耗时</text><text x="16" y="55" class="value">842.6 ms</text><text x="16" y="70" class="small">选定区间内</text>
    <rect class="panel" x="232" width="220" height="78" rx="5"/><text x="248" y="23" class="muted">调用次数</text><text x="248" y="55" class="value">1,284</text><text x="248" y="70" class="small">摘要聚合</text>
    <rect class="panel" x="464" width="220" height="78" rx="5"/><text x="480" y="23" class="muted">区间分配量</text><text x="480" y="55" class="value">6.8 MB</text><text x="480" y="70" class="small">仅可用数据源</text>
    <rect class="panel" x="696" width="220" height="78" rx="5"/><text x="712" y="23" class="muted">GC 次数 / 暂停</text><text x="712" y="55" class="value">2 / 3.4 ms</text><text x="712" y="70" class="yellow small">区间指标，不归因到技能</text>
    <rect class="panel" x="928" width="220" height="78" rx="5"/><text x="944" y="23" class="muted">最慢技能 P95</text><text x="944" y="55" class="value">4.82 ms</text><text x="944" y="70" class="small">样本数 128</text>
    <rect class="panel" x="1160" width="220" height="78" rx="5"/><text x="1176" y="23" class="muted">数据完整性</text><text x="1176" y="55" class="value">完整</text><text x="1176" y="70" class="green small">采样 100% · dropped 0</text>
  </g>

  <rect class="panel" x="20" y="310" width="700" height="330" rx="5"/>
  <text x="40" y="340" class="title">技能 / 阶段热点</text><text x="40" y="361" class="muted">当前区间内聚合；点击行可联动时间轴</text>
  <text x="40" y="390" class="small">技能 / 阶段</text><text x="316" y="390" class="small">次数</text><text x="384" y="390" class="small">总耗时</text><text x="470" y="390" class="small">均值</text><text x="544" y="390" class="small">P95</text><text x="620" y="390" class="small">分配</text>
  <line class="grid" x1="40" y1="400" x2="700" y2="400"/>
  <rect x="34" y="405" width="674" height="39" rx="3" fill="#293345"/>
  <g class="label">
    <text x="40" y="429">Skill_3001 · ultimate</text><text x="316" y="429">128</text><text x="384" y="429">218.4 ms</text><text x="470" y="429">1.71</text><text x="544" y="429" class="red">4.82</text><text x="620" y="429">1.8 MB</text>
    <text x="40" y="473">Skill_1002 · projectile</text><text x="316" y="473">462</text><text x="384" y="473">176.2 ms</text><text x="470" y="473">0.38</text><text x="544" y="473">1.02</text><text x="620" y="473">2.1 MB</text>
    <text x="40" y="517">Skill_2004 · passive</text><text x="316" y="517">519</text><text x="384" y="517">142.8 ms</text><text x="470" y="517">0.27</text><text x="544" y="517">0.61</text><text x="620" y="517">0.4 MB</text>
    <text x="40" y="561">Skill_1101 · dash</text><text x="316" y="561">175</text><text x="384" y="561">96.7 ms</text><text x="470" y="561">0.55</text><text x="544" y="561">1.44</text><text x="620" y="561">0.8 MB</text>
    <text x="40" y="605">Skill_4003 · buff tick</text><text x="316" y="605">516</text><text x="384" y="605">72.1 ms</text><text x="470" y="605">0.14</text><text x="544" y="605">0.39</text><text x="620" y="605">0.2 MB</text>
  </g>
  <rect class="bar" x="190" y="414" width="112" height="5" rx="2"/><rect class="bar" x="190" y="458" width="90" height="5" rx="2"/><rect class="bar" x="190" y="502" width="73" height="5" rx="2"/><rect class="bar" x="190" y="546" width="50" height="5" rx="2"/><rect class="bar" x="190" y="590" width="38" height="5" rx="2"/>

  <rect class="panel" x="740" y="310" width="680" height="330" rx="5"/>
  <text x="760" y="340" class="title">区间时间热点与 GC 事件</text><text x="760" y="361" class="muted">蓝线：该桶技能累计耗时 · 紫线：分配量 · 红线：可观测 GC 暂停</text>
  <line class="grid" x1="790" y1="560" x2="1380" y2="560"/><line class="grid" x1="790" y1="405" x2="790" y2="560"/><line class="grid" x1="790" y1="482" x2="1380" y2="482"/>
  <polyline class="blueLine" points="790,530 865,520 940,500 1015,513 1090,445 1165,480 1240,420 1315,468 1380,430"/>
  <polyline class="purpleLine" points="790,548 865,540 940,530 1015,533 1090,510 1165,520 1240,490 1315,505 1380,488"/>
  <line x1="1090" y1="410" x2="1090" y2="560" stroke="#f27782" stroke-width="2" stroke-dasharray="5 4"/><line x1="1240" y1="410" x2="1240" y2="560" stroke="#f27782" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="1090" cy="410" r="5" class="red"/><circle cx="1240" cy="410" r="5" class="red"/>
  <text x="1055" y="400" class="small">GC 1.2 ms</text><text x="1207" y="400" class="small">GC 2.2 ms</text>
  <text x="790" y="583" class="small">1200</text><text x="970" y="583" class="small">1320</text><text x="1150" y="583" class="small">1440</text><text x="1340" y="583" class="small">1680 帧</text>
  <text x="760" y="615" class="yellow small">GC 与分配为区间观测值；增量/并发回收跨帧时不表示单个技能因果归属。</text>

  <rect class="panel" x="20" y="656" width="900" height="350" rx="5"/>
  <text x="40" y="686" class="title">选中技能调用时间线</text><text x="40" y="707" class="muted">Skill_3001 · frame 1512 · RootContext 4821 · Standard/Verbose 可展开样本</text>
  <text x="40" y="750" class="small">skill.cast</text><rect x="170" y="732" width="700" height="24" rx="3" fill="#3b78b9"/><text x="183" y="749" fill="#fff" font-size="11">4.82 ms · inclusive</text>
  <text x="60" y="790" class="small">trigger.evaluate</text><rect x="220" y="772" width="420" height="23" rx="3" fill="#5166b8"/><text x="233" y="788" fill="#fff" font-size="11">2.94 ms · inclusive</text>
  <text x="80" y="830" class="small">effect.damage</text><rect x="280" y="812" width="255" height="22" rx="3" fill="#6b63d9"/><text x="293" y="827" fill="#fff" font-size="10">1.76 ms</text>
  <text x="100" y="870" class="small">projectile.hit</text><rect x="350" y="852" width="110" height="21" rx="3" fill="#9b68c7"/><text x="362" y="867" fill="#fff" font-size="10">0.62 ms</text>
  <line class="grid" x1="170" y1="913" x2="870" y2="913"/><text x="170" y="935" class="small">0 ms</text><text x="390" y="935" class="small">1.5</text><text x="610" y="935" class="small">3.0</text><text x="840" y="935" class="small">4.8 ms</text>
  <text x="40" y="980" class="yellow small">Verbose 逐调用与调用点分配按平台能力提供；本示例平台不支持可靠的逐方法分配归因。</text>

  <rect class="panel" x="940" y="656" width="480" height="350" rx="5"/>
  <text x="960" y="686" class="title">区间与上下文详情</text>
  <text x="960" y="723" class="label">选中区间</text><text x="1090" y="723" class="muted">1200–1680 帧 · 8.0 秒</text>
  <text x="960" y="753" class="label">技能 / 配置</text><text x="1090" y="753" class="muted">Skill_3001 / 30010101</text>
  <text x="960" y="783" class="label">来源 → 目标</text><text x="1090" y="783" class="muted">hero_07 → target_12</text>
  <text x="960" y="813" class="label">阶段</text><text x="1090" y="813" class="muted">execute / effect.damage</text>
  <text x="960" y="843" class="label">分配数据源</text><text x="1090" y="843" class="green">运行时计数 · 可用</text>
  <text x="960" y="873" class="label">GC 归因</text><text x="1090" y="873" class="yellow">仅区间观测 · 不归因到方法</text>
  <line class="grid" x1="960" y1="895" x2="1400" y2="895"/>
  <text x="960" y="923" class="small">Samples: 128 · sampling: 100% · dropped: 0</text>
  <text x="960" y="950" class="small">查看关联事件 · 导出所选区间 · 对比基线</text>
  <text x="960" y="980" class="small">Off 时不采集；Summary 不保留逐调用树。</text>
</svg>
