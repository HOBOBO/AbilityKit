    maximumSchemaVersion: 3
    maximumPayloadBytes: 4194304
    captureSampleRate: 0.05
  - id: state-hash.push
    opCode: 5206
    direction: s2c
    kind: push
    payloadType: System.UInt64
    maximumPayloadBytes: 4096
  - id: pure-state.push
    opCode: 5207
    direction: s2c
    kind: push
    payloadType: AbilityKit.Protocol.Shooter.ShooterPureStateSnapshotPayload
    codec: custom-binary
    reliability: realtime
    minimumSchemaVersion: 1
    maximumSchemaVersion: 3
    maximumPayloadBytes: 4194304
    captureSampleRate: 0.02
  - id: pure-state-delta.push
    opCode: 5208
    direction: s2c
    kind: push
    payloadType: AbilityKit.Protocol.Shooter.ShooterPureStateSnapshotPayload
    codec: custom-binary
    reliability: realtime
    minimumSchemaVersion: 1
    maximumSchemaVersion: 3
    maximumPayloadBytes: 4194304
    captureSampleRate: 0.02
