    opCode: 5101
    direction: c2s
    kind: event
    payloadType: AbilityKit.Protocol.Shooter.ShooterInputPayload
    reliability: realtime
    maximumPayloadBytes: 262144
    captureSampleRate: 0.1
  - id: start-game.push
    opCode: 5201
    direction: s2c
    kind: push
    payloadType: AbilityKit.Protocol.Shooter.ShooterStartGamePayload
    maximumPayloadBytes: 1048576
  - id: state.push
    opCode: 5202
    direction: s2c
    kind: push
    payloadType: AbilityKit.Protocol.Shooter.ShooterStateSnapshotPayload
    reliability: realtime
    maximumPayloadBytes: 4194304
    captureSampleRate: 0.05
  - id: events.push
    opCode: 5203
    direction: s2c
    kind: push
    payloadType: AbilityKit.Protocol.Shooter.ShooterEventSnapshot[]
    maximumPayloadBytes: 1048576
    captureSampleRate: 0.25
  - id: packed-state.push
    opCode: 5204
    direction: s2c
    kind: push
    payloadType: AbilityKit.Protocol.Shooter.ShooterPackedSnapshotPayload
    reliability: realtime
    minimumSchemaVersion: 2
    maximumSchemaVersion: 3
    maximumPayloadBytes: 4194304
    captureSampleRate: 0.05
  - id: packed-state-delta.push
    opCode: 5205
    direction: s2c
    kind: push
    payloadType: AbilityKit.Protocol.Shooter.ShooterPackedSnapshotPayload
    reliability: realtime
