<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
 <defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#dce7f5}.bg{fill:#0d1420}.p{fill:#151f2d;stroke:#2b3b50;stroke-width:1.5}.m{fill:#8fa2b9}.b{fill:#54a8ff}.g{fill:#54d6a0}.o{fill:#ffb45e}.r{fill:#ff737d}.line{stroke:#536a82;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs>
 <rect class="bg" width="1440" height="860"/>
 <rect class="p" x="24" y="20" width="1392" height="62" rx="10"/><text x="48" y="59" font-size="23" font-weight="bold">Battle Analysis · Shared Core / Specialized Windows</text>
 <rect class="p" x="44" y="112" width="1352" height="154" rx="10"/><text x="68" y="148" font-size="19">Shared Analysis Foundation</text><text x="68" y="180" class="b" font-size="13">AnalysisSession · FrameRef · EntityRef · TraceRef · Capability · AccessPolicy</text><text x="68" y="208" class="m" font-size="13">Artifact / Replay / Runtime adapters · Index / Cache · Selection / Bookmark · Navigation · Command envelope</text><text x="68" y="236" class="m" font-size="12">低依赖、可序列化、无 Unity Scene / BattleContext / 英雄技能执行特例</text>
 <path class="line" d="M720 266 V306"/>
 <rect class="p" x="44" y="306" width="410" height="334" rx="10"/><text x="68" y="344" class="b" font-size="20">Evidence Explorer</text><text x="68" y="374" class="m" font-size="13">Offline Evidence · Read-only</text><rect x="68" y="402" width="362" height="52" rx="6" fill="#20354c"/><text x="86" y="434" font-size="13">Artifact / Trace / Event / State</text><rect x="68" y="470" width="362" height="52" rx="6" fill="#20354c"/><text x="86" y="502" font-size="13">只读时间轴 · Diff · Report</text><text x="68" y="565" class="g" font-size="13">跳转 → Replay Lab / Comparison</text><text x="68" y="594" class="m" font-size="12">不持有逻辑世界，不发送运行时命令</text>
 <rect class="p" x="514" y="306" width="410" height="334" rx="10"/><text x="538" y="344" class="g" font-size="20">Replay Lab</text><text x="538" y="374" class="m" font-size="13">Isolated Replay · Executable</text><rect x="538" y="402" width="362" height="52" rx="6" fill="#20354c"/><text x="556" y="434" font-size="13">Input Replay / Seek / Step</text><rect x="538" y="470" width="362" height="52" rx="6" fill="#20354c"/><text x="556" y="502" font-size="13">Preview Scene Projection</text><text x="538" y="565" class="g" font-size="13">读取真实 Replay 世界状态</text><text x="538" y="594" class="m" font-size="12">可创建独立分支，不修改生产战斗</text>
 <rect class="p" x="984" y="306" width="410" height="334" rx="10"/><text x="1008" y="344" class="o" font-size="20">Runtime Monitor / Control</text><text x="1008" y="374" class="m" font-size="13">Live Runtime · Read-only / Explicit Write</text><rect x="1008" y="402" width="362" height="52" rx="6" fill="#20354c"/><text x="1026" y="434" font-size="13">Current Frame / Prediction / Rollback</text><rect x="1008" y="470" width="170" height="52" rx="6" fill="#4b3032"/><text x="1027" y="502" class="r" font-size="13">命令与权限</text><rect x="1190" y="470" width="180" height="52" rx="6" fill="#20354c"/><text x="1208" y="502" font-size="13">Export Evidence</text><text x="1008" y="565" class="o" font-size="13">回滚不是普通时间轴拖动</text><text x="1008" y="594" class="m" font-size="12">所有可写动作都有确认、结果和审计</text>
 <path class="line" d="M454 472 H514"/><path class="line" d="M924 472 H984"/><text x="462" y="456" class="m" font-size="11">Navigation</text><text x="932" y="456" class="m" font-size="11">Navigation / Command boundary</text>
 <rect class="p" x="44" y="690" width="1350" height="118" rx="10"/><text x="68" y="728" font-size="17">窗口协作规则</text><text x="68" y="760" class="m" font-size="13">共享不可变 AnalysisNavigation：sessionId · worldKind · frame · entityRef · traceRef · filters</text><text x="68" y="786" class="m" font-size="13">传递导航和数据引用，不共享可变逻辑世界实例；关闭 Preview Scene 不停止 Live Runtime。</text>
