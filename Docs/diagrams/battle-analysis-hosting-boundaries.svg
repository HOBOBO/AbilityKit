 <path class="line" d="M450 275 H520"/><path class="line" d="M930 275 H1000"/><text x="460" y="260" class="m" font-size="11">投影</text><text x="940" y="260" class="m" font-size="11">连接</text>
 <rect class="p" x="40" y="490" width="880" height="330" rx="10"/><text x="64" y="528" font-size="20">离线产物与独立 Runner</text><rect x="64" y="564" width="220" height="70" rx="7" fill="#263955"/><text x="82" y="594" font-size="14">Artifact / Trace</text><text x="82" y="616" class="m" font-size="11">只读证据容器</text><rect x="330" y="564" width="220" height="70" rx="7" fill="#263955"/><text x="348" y="594" font-size="14">FrameRecord / Replay</text><text x="348" y="616" class="m" font-size="11">输入与重演来源</text><rect x="596" y="564" width="280" height="70" rx="7" fill="#263955"/><text x="614" y="594" font-size="14">独立 Runner / CI</text><text x="614" y="616" class="m" font-size="11">批量重演、哈希校验、报告</text><path class="line" d="M174 634 V704 H720 V634"/><text x="360" y="693" class="m" font-size="12">RunManifest / Attachment URI / Stable IDs</text><text x="64" y="756" class="m" font-size="13">Editor 可以本地读取；Web 只消费版本化产物；长任务不阻塞 Editor</text>
 <rect class="p" x="1000" y="490" width="400" height="330" rx="10"/><text x="1024" y="528" class="b" font-size="20">Web Analyzer</text><text x="1024" y="560" class="m" font-size="13">只读证据浏览与协作分析</text><rect x="1024" y="590" width="352" height="42" rx="6" fill="#20354c"/><text x="1042" y="616" font-size="13">Sessions · Trends · Compare</text><rect x="1024" y="646" width="352" height="42" rx="6" fill="#20354c"/><text x="1042" y="672" font-size="13">Trace · State · Bookmarks</text><text x="1024" y="726" class="g" font-size="13">✓ 不加载 Unity 场景</text><text x="1024" y="750" class="g" font-size="13">✓ 不直接控制真实战斗</text><text x="1024" y="774" class="m" font-size="12">未来 Replay 请求走后端 allow-list</text>
 <path class="line" d="M876 598 H1000"/><text x="900" y="584" class="m" font-size="11">产物</text>
</svg>
