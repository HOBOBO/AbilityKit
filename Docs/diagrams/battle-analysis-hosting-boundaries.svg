<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
 <defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#dce7f5}.bg{fill:#0d1420}.p{fill:#151f2d;stroke:#2b3b50;stroke-width:1.5}.m{fill:#8fa2b9}.b{fill:#54a8ff}.g{fill:#54d6a0}.o{fill:#ffb45e}.r{fill:#ff737d}.line{stroke:#50637b;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs>
 <rect class="bg" width="1440" height="900"/><rect class="p" x="24" y="20" width="1392" height="70" rx="10"/><text x="48" y="62" font-size="24" font-weight="bold">Battle Analysis Workbench · Hosting Boundaries</text><text x="930" y="60" class="m" font-size="14">统一会话 / 帧轴 / 实体 / Trace 关联</text>
 <rect class="p" x="40" y="125" width="410" height="300" rx="10"/><text x="64" y="162" class="b" font-size="20">Unity Editor Window</text><text x="64" y="194" class="m" font-size="13">开发者主工作台 · 可停靠 · 高密度调试</text><rect x="64" y="222" width="166" height="42" rx="6" fill="#20354c"/><text x="82" y="248" font-size="13">Offline Evidence</text><rect x="246" y="222" width="166" height="42" rx="6" fill="#20354c"/><text x="262" y="248" font-size="13">Isolated Replay</text><rect x="64" y="278" width="166" height="42" rx="6" fill="#20354c"/><text x="84" y="304" class="o" font-size="13">Live Runtime</text><rect x="246" y="278" width="166" height="42" rx="6" fill="#20354c"/><text x="260" y="304" font-size="13">Trace / State / Diff</text><text x="64" y="354" class="m" font-size="12">参数、来源、能力、权限、结果</text><text x="64" y="378" class="m" font-size="12">不直接复制生产配置定义</text>
 <rect class="p" x="520" y="125" width="410" height="300" rx="10"/><text x="544" y="162" class="g" font-size="20">Preview Scene</text><text x="544" y="194" class="m" font-size="13">只承载可视投影，不是逻辑状态权威</text><rect x="544" y="222" width="362" height="114" rx="6" fill="#101a27" stroke="#30445b"/><circle cx="650" cy="278" r="22" fill="#337fc4"/><circle cx="790" cy="262" r="22" fill="#b75d64"/><path d="M566 312 Q700 250 878 310" fill="none" stroke="#294157" stroke-width="4"/><text x="566" y="367" class="m" font-size="12">Replay World → Actor / Camera / VFX / Debug Gizmo</text><text x="544" y="393" class="m" font-size="12">关闭预览不会停止 Live Runtime</text>
