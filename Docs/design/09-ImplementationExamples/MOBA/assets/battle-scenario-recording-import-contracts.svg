<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#93a9bb"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#e9f1f8}.t{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.p{font-size:14px}.box{stroke:#557188;stroke-width:2;rx:12}.blue{fill:#183956}.purple{fill:#3d2b55}.green{fill:#205141}.gold{fill:#5b431e}.gray{fill:#202c36}.line{stroke:#93a9bb;stroke-width:2.5;fill:none;marker-end:url(#a)}.muted{fill:#9fb1bf}</style></defs>
<rect width="1500" height="880" fill="#101820"/><text x="55" y="52" class="t">数据契约、来源追溯与晋升门</text>
<rect x="55" y="100" width="330" height="300" class="box blue"/><text x="80" y="140" class="h">Recording Package</text><text x="80" y="180" class="p">recordingId / runId</text><text x="80" y="208" class="p">world + config version</text><text x="80" y="236" class="p">actors + environment</text><text x="80" y="264" class="p">raw input + frame range</text><text x="80" y="292" class="p">trace + snapshots</text><text x="80" y="320" class="p">evidence references</text><text x="80" y="365" class="p muted">事实和证据，immutable</text>
<rect x="470" y="100" width="330" height="300" class="box purple"/><text x="495" y="140" class="h">Candidate Metadata</text><text x="495" y="180" class="p">sourceRecordingId</text><text x="495" y="208" class="p">sourceFrame / sourceNodeId</text><text x="495" y="236" class="p">converterVersion</text><text x="495" y="264" class="p">confidence + warnings</text><text x="495" y="292" class="p">rawPayloadRef</text><text x="495" y="320" class="p">accept / edit / ignore</text><text x="495" y="365" class="p muted">候选字段必须可追溯</text>
<rect x="885" y="100" width="330" height="300" class="box green"/><text x="910" y="140" class="h">Formal Scenario</text><text x="910" y="180" class="p">.battlescene / scenarioRef</text><text x="910" y="208" class="p">.battlescenario Timeline</text><text x="910" y="236" class="p">explicit Assertions</text><text x="910" y="264" class="p">execution profile + seed</text><text x="910" y="292" class="p">artifact provenance</text><text x="910" y="320" class="p">version controlled</text><text x="910" y="365" class="p muted">可脱离原始录制执行</text>
<path d="M385 250 H470 M800 250 H885" class="line"/>
<rect x="1300" y="100" width="145" height="300" class="box gold"/><text x="1320" y="140" class="h">Evidence</text><text x="1320" y="185" class="p">replay</text><text x="1320" y="215" class="p">trace</text><text x="1320" y="245" class="p">video</text><text x="1320" y="275" class="p">artifact</text><text x="1320" y="325" class="p muted">只读引用</text><path d="M1215 180 H1300" class="line dash"/>
<rect x="55" y="500" width="1390" height="260" class="box gray"/><text x="80" y="540" class="h">晋升门（全部通过后才能进入 formal）</text><rect x="85" y="585" width="220" height="95" class="box blue"/><text x="105" y="620" class="p">1 · 来源完整</text><text x="105" y="650" class="p">manifest / 附件 / 版本</text><rect x="350" y="585" width="220" height="95" class="box blue"/><text x="370" y="620" class="p">2 · 配置可解析</text><text x="370" y="650" class="p">Hero / Skill / Effect</text><rect x="615" y="585" width="220" height="95" class="box purple"/><text x="635" y="620" class="p">3 · 编译通过</text><text x="635" y="650" class="p">结构和语义校验</text><rect x="880" y="585" width="220" height="95" class="box purple"/><text x="900" y="620" class="p">4 · 重跑稳定</text><text x="900" y="650" class="p">状态 / trace / hash</text><rect x="1145" y="585" width="220" height="95" class="box green"/><text x="1165" y="620" class="p">5 · 人工确认</text><text x="1165" y="650" class="p">接受候选断言</text><path d="M305 632 H350 M570 632 H615 M835 632 H880 M1100 632 H1145" class="line"/>
<text x="80" y="725" class="p muted">任一门失败：保留 candidate + warning + evidence，不覆盖原始录制，也不伪造正式预期</text>
</svg>
