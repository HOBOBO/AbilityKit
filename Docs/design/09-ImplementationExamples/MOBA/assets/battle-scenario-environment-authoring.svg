  <text x="1196" y="263" class="small">Team / Player</text><rect x="1320" y="248" width="220" height="27" class="subpanel round"/><text x="1332" y="267" class="ui">T1 · player_1 ▾</text>
  <text x="1196" y="299" class="small">Position</text><rect x="1320" y="284" width="220" height="27" class="bluebg round"/><text x="1332" y="303" class="ui">x 0.0 · y 0.0 · z 0.0</text>
