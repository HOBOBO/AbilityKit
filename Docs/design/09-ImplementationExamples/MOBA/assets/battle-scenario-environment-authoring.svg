  <circle cx="880" cy="380" r="14" fill="#54d6d0" fill-opacity=".18" stroke="#54d6d0" stroke-width="2"/><path d="M880 360v40M860 380h40" stroke="#54d6d0"/><text x="880" y="414" class="small center">target_spawn</text>
  <!-- actors -->
