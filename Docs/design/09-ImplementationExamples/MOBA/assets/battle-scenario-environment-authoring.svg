<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Battle Scenario 环境构建器方向原型</title>
  <desc id="desc">展示预设、空间编辑、角色属性覆盖和 DSL 预览如何在同一个环境构建器中协同工作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171b25"/><stop offset="1" stop-color="#10131b"/></linearGradient>
    <linearGradient id="toolbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#252b38"/><stop offset="1" stop-color="#1b202b"/></linearGradient>
    <linearGradient id="arena" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17323a"/><stop offset="1" stop-color="#0e202a"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#31515a" stroke-width="1" opacity=".45"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#74bdff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .ui{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#d9e0ed;font-size:13px}.small{font-size:11px;fill:#9ca8bb}.tiny{font-size:10px;fill:#8793a7}.title{font-size:16px;font-weight:600;fill:#f4f7fb}
      .panel{fill:#1b202b;stroke:#313949;stroke-width:1}.subpanel{fill:#202735;stroke:#374153;stroke-width:1}.header{fill:#252c39}.line{stroke:#3a4454;stroke-width:1}.muted{fill:#77849a}
      .blue{fill:#59a9ff}.bluebg{fill:#214765;stroke:#4e9ce8}.purple{fill:#c58cff}.purplebg{fill:#3d285a;stroke:#a86ee8}.green{fill:#76d69b}.greenbg{fill:#1f4a3d;stroke:#50bd87}.red{fill:#ff7883}.redbg{fill:#552d37;stroke:#e45a69}.yellow{fill:#f2c96d}.yellowbg{fill:#564525;stroke:#d6ac51}.cyan{fill:#54d6d0}.orange{fill:#ffab62}.bold{font-weight:600}.center{text-anchor:middle}.right{text-anchor:end}.round{rx:5;ry:5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="18" y="18" width="1564" height="964" rx="8" fill="#11151d" stroke="#3d4656" filter="url(#shadow)"/>
  <rect x="19" y="19" width="1562" height="56" rx="8" fill="url(#toolbar)"/>
  <circle cx="42" cy="47" r="7" fill="#e86c74"/><circle cx="65" cy="47" r="7" fill="#e1b85c"/><circle cx="88" cy="47" r="7" fill="#69c58c"/>
  <text x="116" y="42" class="ui title">Environment Builder</text><text x="116" y="60" class="small">jhin-e-w-scene · 环境作者视图</text>
  <rect x="430" y="30" width="94" height="32" class="bluebg round"/><text x="477" y="50" class="ui center bold">空间编辑</text>
  <rect x="530" y="30" width="94" height="32" class="subpanel round"/><text x="577" y="50" class="ui center">结构化</text>
  <rect x="630" y="30" width="94" height="32" class="subpanel round"/><text x="677" y="50" class="ui center">DSL 预览</text>
  <rect x="744" y="30" width="104" height="32" class="subpanel round"/><text x="796" y="50" class="ui center">撤销 Ctrl+Z</text>
  <rect x="860" y="30" width="94" height="32" class="subpanel round"/><text x="907" y="50" class="ui center">保存</text>
  <rect x="966" y="30" width="130" height="32" class="greenbg round"/><text x="1031" y="50" class="ui center bold">✓ 编译预览</text>
  <text x="1120" y="42" class="small">来源</text><text x="1120" y="59" class="yellow bold">● 预设 + 显式差异</text><text x="1548" y="50" class="green right">已保存 · 0 个错误</text>

  <!-- left wizard -->
  <rect x="30" y="88" width="282" height="652" class="panel"/><rect x="30" y="88" width="282" height="44" class="header"/><text x="48" y="115" class="ui bold">环境构建步骤</text><text x="292" y="115" class="blue right">？</text>
  <text x="53" y="164" class="green">✓</text><text x="78" y="164" class="ui bold">1 选择环境预设</text><text x="78" y="185" class="small">duel-arena · 12m × 8m</text>
  <line x1="61" y1="197" x2="61" y2="232" stroke="#4a6673" stroke-width="2"/>
  <circle cx="61" cy="247" r="10" fill="#214765" stroke="#59a9ff"/><text x="61" y="251" class="ui center">2</text><text x="86" y="251" class="ui bold">摆放角色与锚点</text><text x="86" y="272" class="small">2 Actors · 3 Anchors</text>
  <line x1="61" y1="284" x2="61" y2="320" stroke="#4a6673" stroke-width="2"/>
  <circle cx="61" cy="335" r="10" fill="#202735" stroke="#4a5668"/><text x="61" y="339" class="small center">3</text><text x="86" y="339" class="ui">添加障碍与几何</text><text x="86" y="360" class="small">1 Wall · collision/default</text>
  <line x1="61" y1="372" x2="61" y2="408" stroke="#4a5668" stroke-width="2"/>
  <circle cx="61" cy="423" r="10" fill="#202735" stroke="#4a5668"/><text x="61" y="427" class="small center">4</text><text x="86" y="427" class="ui">设置初始状态</text><text x="86" y="448" class="small">HP / Buff / Tag / Loadout</text>
  <line x1="61" y1="460" x2="61" y2="496" stroke="#4a5668" stroke-width="2"/>
  <circle cx="61" cy="511" r="10" fill="#202735" stroke="#4a5668"/><text x="61" y="515" class="small center">5</text><text x="86" y="515" class="ui">预检与导出</text><text x="86" y="536" class="small">Scene → Case → Runner</text>
