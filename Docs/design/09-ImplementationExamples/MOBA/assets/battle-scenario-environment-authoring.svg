  <circle cx="880" cy="380" r="28" fill="#873b50" stroke="#f18798" stroke-width="3"/><text x="880" y="385" class="ui center bold">目标</text><text x="880" y="349" class="tiny center">enemy_01 · T2</text>
  <!-- target line / landing marker -->
  <line x1="579" y1="362" x2="846" y2="362" stroke="#ffab62" stroke-width="2" stroke-dasharray="8 5"/><circle cx="775" cy="362" r="20" fill="#ffab62" fill-opacity=".15" stroke="#ffab62" stroke-width="2"/><path d="M775 343v38M756 362h38" stroke="#ffab62"/><text x="775" y="399" class="small center">W 释放方向 / E 落点</text>
