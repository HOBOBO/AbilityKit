<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#8aa0b8"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#e7eef7}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.p{font-size:14px}.box{stroke:#55718d;stroke-width:2;rx:12}.source{fill:#173654}.convert{fill:#3a2855}.review{fill:#513f1f}.formal{fill:#1d4b3d}.muted{fill:#9bb0c5}.line{stroke:#8aa0b8;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 8}</style></defs>
  <rect width="1500" height="860" fill="#101820"/>
  <text x="60" y="55" class="title">真实战斗录制 → BattleScenario 候选 → 正式用例</text>
  <text x="60" y="84" class="p muted">录制是证据来源；Scenario 是可编辑、可审查、可重复执行的作者资产</text>
  <rect x="60" y="130" width="270" height="220" class="box source"/><text x="85" y="165" class="h">1. Recording Package</text><text x="85" y="198" class="p">FrameRecord / 原始 payload</text><text x="85" y="224" class="p">上下文 manifest</text><text x="85" y="250" class="p">Trace / 状态快照 / 哈希</text><text x="85" y="276" class="p">可选录像和截图索引</text><text x="85" y="320" class="p muted">不可变 · 可回放 · 可审计</text>
  <rect x="390" y="130" width="270" height="220" class="box convert"/><text x="415" y="165" class="h">2. Segment + Normalize</text><text x="415" y="198" class="p">时间窗 / 事件锚点</text><text x="415" y="224" class="p">输入 opcode → 语义动作</text><text x="415" y="250" class="p">Actor / 目标 / 坐标归一</text><text x="415" y="276" class="p">Trace / State 关联</text><text x="415" y="320" class="p muted">未知内容保留 raw 扩展</text>
  <rect x="720" y="130" width="270" height="220" class="box review"/><text x="745" y="165" class="h">3. Candidate Workspace</text><text x="745" y="198" class="p">候选 .battlescene</text><text x="745" y="224" class="p">候选 .battlescenario</text><text x="745" y="250" class="p">候选断言 + 置信度</text><text x="745" y="276" class="p">provenance / warning</text><text x="745" y="320" class="p muted">人工接受 · 修改 · 忽略</text>
  <rect x="1050" y="130" width="360" height="220" class="box formal"/><text x="1075" y="165" class="h">4. Compile + Re-run</text><text x="1075" y="198" class="p">BattleScenarioCompiler</text><text x="1075" y="224" class="p">Headless / Unity Runner</text><text x="1075" y="250" class="p">artifact v1 + Trace + diff</text><text x="1075" y="276" class="p">确定性 / 配置 / 表现门禁</text><text x="1075" y="320" class="p muted">通过后晋升 formal</text>
  <path d="M330 240 H390 M660 240 H720 M990 240 H1050" class="line"/>
  <rect x="100" y="460" width="390" height="270" class="box" fill="#202c38"/><text x="125" y="495" class="h">职责边界</text><text x="125" y="530" class="p">录制系统：记录事实，不定义预期</text><text x="125" y="560" class="p">转换器：解释输入，保留不确定性</text><text x="125" y="590" class="p">BattleScenario：编辑意图，编译 IR</text><text x="125" y="620" class="p">Runner：执行并判定结果</text><text x="125" y="650" class="p">Artifact：跨端消费和追溯</text><text x="125" y="690" class="p muted">通用层不解析 MOBA 生产配置</text>
  <rect x="560" y="460" width="390" height="270" class="box" fill="#202c38"/><text x="585" y="495" class="h">不能自动晋升的条件</text><text x="585" y="530" class="p">配置版本无法解析</text><text x="585" y="560" class="p">起始环境或 Actor 无法重建</text><text x="585" y="590" class="p">输入序列不闭合或 opcode 未知</text><text x="585" y="620" class="p">重复重跑状态不一致</text><text x="585" y="650" class="p">断言只来自一次偶然观察</text><text x="585" y="690" class="p muted">保留候选和证据，显示 needs-review</text>
  <rect x="1020" y="460" width="390" height="270" class="box" fill="#202c38"/><text x="1045" y="495" class="h">三种时间语义</text><text x="1045" y="530" class="p">sourceFrame：真实战斗原始帧</text><text x="1045" y="560" class="p">relativeAtMs：Scenario 片段相对时间</text><text x="1045" y="590" class="p">observedFrame：重跑实际观察帧</text><text x="1045" y="630" class="p">三者通过 provenance 关联</text><text x="1045" y="690" class="p muted">不能用视频时间代替逻辑时间</text>
  <path d="M855 350 V425" class="line dash"/><text x="872" y="400" class="p muted">需要人工审查</text>
</svg>
