<rect x="935" y="800" width="930" height="570" class="panel"/>
<text x="960" y="837" class="head">⑤ Trigger Authoring：发射 → 投射物 → 命中效果</text>
<text x="960" y="862" class="small">权威源：Sources/moba-skills.trigger.json；已发布模块：ability_moba_skills.Module.asset</text>
<rect x="965" y="900" width="185" height="105" class="trigger"/><text x="1057" y="931" text-anchor="middle" class="label">普通弹发射</text><text x="1057" y="958" text-anchor="middle" class="body">Trigger 30010401</text><text x="1057" y="984" text-anchor="middle" class="small">shoot_projectile</text>
<rect x="1205" y="900" width="190" height="105" class="configured"/><text x="1300" y="931" text-anchor="middle" class="label">共享 Launcher</text><text x="1300" y="958" text-anchor="middle" class="body">33010401</text><text x="1300" y="984" text-anchor="middle" class="small">track_target=false</text>
<rect x="1450" y="900" width="180" height="105" class="configured"/><text x="1540" y="931" text-anchor="middle" class="label">普通投射物</text><text x="1540" y="958" text-anchor="middle" class="body">Projectile 32010401</text><text x="1540" y="984" text-anchor="middle" class="small">命中回调</text>
<rect x="1680" y="900" width="155" height="105" class="trigger"/><text x="1757" y="931" text-anchor="middle" class="label">命中触发</text><text x="1757" y="958" text-anchor="middle" class="body">30010402</text><text x="1757" y="984" text-anchor="middle" class="small">伤害 + 减速</text>
<path d="M1150 952 L1203 952" class="line"/><path d="M1395 952 L1448 952" class="line"/><path d="M1630 952 L1678 952" class="line"/>
<rect x="965" y="1030" width="185" height="105" class="trigger"/><text x="1057" y="1061" text-anchor="middle" class="label">终结弹发射</text><text x="1057" y="1088" text-anchor="middle" class="body">Trigger 30010411</text><text x="1057" y="1114" text-anchor="middle" class="small">shoot_projectile</text>
<rect x="1205" y="1030" width="190" height="105" class="configured"/><text x="1300" y="1061" text-anchor="middle" class="label">共享 Launcher</text><text x="1300" y="1088" text-anchor="middle" class="body">33010401</text><text x="1300" y="1114" text-anchor="middle" class="small">track_target=false</text>
<rect x="1450" y="1030" width="180" height="105" class="configured"/><text x="1540" y="1061" text-anchor="middle" class="label">终结投射物</text><text x="1540" y="1088" text-anchor="middle" class="body">Projectile 32010402</text><text x="1540" y="1114" text-anchor="middle" class="small">命中回调</text>
<rect x="1680" y="1030" width="155" height="105" class="trigger"/><text x="1757" y="1061" text-anchor="middle" class="label">命中触发</text><text x="1757" y="1088" text-anchor="middle" class="body">30010412</text><text x="1757" y="1114" text-anchor="middle" class="small">伤害 + 减速</text>
<path d="M1150 1082 L1203 1082" class="line"/><path d="M1395 1082 L1448 1082" class="line"/><path d="M1630 1082 L1678 1082" class="line"/>
<rect x="965" y="1162" width="870" height="163" class="subpanel"/>
<text x="985" y="1193" class="label">伤害与效果配置（普通 / 终结共通结构）</text>
<text x="985" y="1222" class="body">30010402：攻击伤害系数 0.7，damage 来源参数；追加 Buff 32010403（减速）。</text>
<text x="985" y="1250" class="body">30010412：攻击伤害系数 0.7，finalDamage 来源参数；追加 Buff 32010403。</text>
<text x="985" y="1278" class="body">30010403 / 30010413：目标生命 ≤ 50% 时，在 damage.attack.before_calc 增加目标已损失生命比例 × 0.5。</text>
<text x="985" y="1306" class="small">普通/终结弹由不同投射物 ID 区分；发射器复用。伤害在投射物命中后结算，低血量修正由独立事件触发。</text>

<text x="42" y="1420" class="small">主要核对文件：character_hfsm.json · MobaCharacterHfsmParameterService.cs · character_view_actions.json · SkillFlowCO.asset · skill_30010401.json / .moba.presentation.json · moba-skills.trigger.json · JhinSkillAcceptanceTests.cs</text>
<text x="42" y="1450" class="small">验收测试确认：R 的普通发射 ×3、终结发射 ×1；普通 / 终结投射物分别走各自命中 Trigger。橙色缺口表示 RPhase 生命周期接线尚未接通；动作映射配置已就绪。</text>
</svg>
